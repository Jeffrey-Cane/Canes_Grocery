<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="api-base" content="/api">
  <meta name="description" content="Your Account — GROCERY STORE">
  <title>My Account — GROCERY STORE</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="style2.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛒</text></svg>">
  <style>
    .account-container {
      max-width: 600px;
      margin: 60px auto;
      padding: 40px;
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
    }
    .account-header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 40px;
      padding-bottom: 20px;
      border-bottom: 2px solid var(--bg-secondary);
    }
    .account-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--accent-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 2rem;
      font-weight: bold;
    }
    .account-info h1 {
      font-size: 1.5rem;
      margin: 0;
      color: var(--text-heading);
    }
    .account-info p {
      margin: 4px 0;
      color: var(--text-light);
      font-size: 0.9rem;
    }
    .account-section {
      margin-bottom: 32px;
    }
    .account-section h3 {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-heading);
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 2px solid var(--bg-secondary);
      padding-bottom: 8px;
    }
    .account-field {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--bg-secondary);
    }
    .account-field label {
      font-weight: 500;
      color: var(--text-light);
      font-size: 0.9rem;
    }
    .account-field value {
      color: var(--text-heading);
      font-weight: 600;
    }
    .account-actions {
      display: flex;
      gap: 12px;
      margin-top: 32px;
    }
    .btn-logout {
      flex: 1;
      padding: 14px;
      background: #C75C5C;
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .btn-logout:hover {
      background: #b34848;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(199, 92, 92, 0.3);
    }
    .btn-back {
      flex: 1;
      padding: 14px;
      background: var(--bg-secondary);
      color: var(--text-heading);
      border: none;
      border-radius: var(--radius-sm);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .btn-back:hover {
      background: var(--accent-secondary);
    }
    .error-message {
      background: rgba(199, 92, 92, 0.1);
      color: #C75C5C;
      padding: 16px;
      border-radius: var(--radius-sm);
      margin-bottom: 20px;
      text-align: center;
    }
  </style>
</head>
<body>
  <!-- NAVBAR -->
  <nav class="navbar" id="navbar">
    <a href="index.html" class="navbar__logo">
      <div class="navbar__logo-icon">G</div>
      GROCERY STORE
    </a>
    <ul class="navbar__links">
      <li><a href="index.html">Home</a></li>
      <li><a href="index.html#products-section">Shop</a></li>
      <li><a href="index.html#features">About</a></li>
      <li><a href="index.html#footer">Contact</a></li>
    </ul>
    <div class="navbar__actions">
      <a href="index.html" style="text-decoration: none; color: var(--text-body); font-size: 0.9rem; font-weight: 500;">← Back to Store</a>
    </div>
  </nav>

  <!-- ACCOUNT CONTAINER -->
  <div class="account-container">
    <div id="error-message"></div>

    <div class="account-header">
      <div class="account-avatar" id="user-avatar">👤</div>
      <div class="account-info">
        <h1 id="user-name">Loading...</h1>
        <p id="user-email">email@example.com</p>
        <p id="user-role">customer</p>
      </div>
    </div>

    <!-- PROFILE SECTION -->
    <div class="account-section">
      <h3>📋 Profile Information</h3>
      <div class="account-field">
        <label>Name</label>
        <value id="profile-name">—</value>
      </div>
      <div class="account-field">
        <label>Email</label>
        <value id="profile-email">—</value>
      </div>
      <div class="account-field">
        <label>Phone</label>
        <value id="profile-phone">—</value>
      </div>
      <div class="account-field">
        <label>Address</label>
        <value id="profile-address">—</value>
      </div>
    </div>

    <!-- ACCOUNT SECTION -->
    <div class="account-section">
      <h3>🔐 Account</h3>
      <div class="account-field">
        <label>Account Type</label>
        <value id="account-role">Customer</value>
      </div>
      <div class="account-field">
        <label>Member Since</label>
        <value id="account-created">—</value>
      </div>
    </div>

    <!-- ACTIONS -->
    <div class="account-actions">
      <button class="btn-back" onclick="window.location.href='index.html'">← Back to Store</button>
      <button class="btn-logout" onclick="handleLogout()">🚪 Sign Out</button>
    </div>
  </div>

  <!-- BACKEND API AUTH -->
  <script defer src="auth.js"></script>
  <script>
    // Require authentication
    window.addEventListener('load', function() {
      CaneAuth.init().then(function() {
        if (!CaneAuth.isLoggedIn()) {
          window.location.href = 'login.html';
          return;
        }
        loadAccountData();
      }).catch(function(err) {
        console.error('Auth init failed:', err);
        window.location.href = 'login.html';
      });
    });

    function loadAccountData() {
      var user = CaneAuth.getSession();
      if (!user) {
        showError('User data not available');
        return;
      }

      // User header
      document.getElementById('user-avatar').textContent = (user.name || 'U').charAt(0).toUpperCase();
      document.getElementById('user-name').textContent = user.name || 'User';
      document.getElementById('user-email').textContent = user.email || '—';
      document.getElementById('user-role').textContent = (user.role === 'admin' ? '👑 Admin' : '👤 Customer');

      // Profile section
      document.getElementById('profile-name').textContent = user.name || '—';
      document.getElementById('profile-email').textContent = user.email || '—';
      document.getElementById('profile-phone').textContent = user.phone || 'Not provided';
      document.getElementById('profile-address').textContent = user.address || 'Not provided';

      // Account section
      document.getElementById('account-role').textContent = user.role === 'admin' ? '👑 Admin' : '👤 Customer';

      if (user.createdAt) {
        var date = new Date(user.createdAt);
        document.getElementById('account-created').textContent = date.toLocaleDateString('en-US', {
          year: 'numeric',
          month: 'long',
          day: 'numeric'
        });
      }
    }

    function handleLogout() {
      if (confirm('Are you sure you want to sign out?')) {
        CaneAuth.logout();
      }
    }

    function showError(msg) {
      var el = document.getElementById('error-message');
      el.innerHTML = '<div class="error-message">' + msg + '</div>';
    }
  </script>
</body>
</html>
